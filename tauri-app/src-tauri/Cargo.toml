[package]
name = "leogit"
version = "0.1.18"
description = "Visual Git client built with Tauri and Svelte"
authors = ["Leonardo Manrique"]
edition = "2021"

[dependencies]
tauri = { version = "2.11.2", features = [] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_repr = "0.1.20"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
directories = "6.0.0"
reqwest = { version = "0.13.3", features = ["json"] }
portable-pty = "0.9.0"
lazy_static = "1.4.0"
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = "0.5"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-single-instance = "2.4.2"
# Recoverable deletes for the Changes-tab "Discard" action: never-committed
# files go to the OS trash rather than being unlinked outright.
trash = "5"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dev-dependencies]
tempfile = "3"

[lib]
name = "leogit_lib"
path = "src/lib.rs"

[[bin]]
name = "leogit"
path = "src/main.rs"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
