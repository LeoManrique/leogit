[package]
name = "leogit-ffi"
version = "0.1.0"
edition = "2024"
description = "UniFFI bridge exposing leogit-core to the native SwiftUI macOS client"
publish = false

[lib]
name = "leogit_ffi"
# `staticlib` is the artifact the macOS app links; `lib` keeps the crate usable
# from Rust (tests, and `cargo check --workspace`).
crate-type = ["lib", "staticlib"]

[dependencies]
leogit-core = { path = "../../../core" }
# `rt` provides `spawn_blocking`, which `repo_sync_status` uses to keep its
# synchronous core call (a background fetch can hold a thread for up to 12 s)
# off Swift's cooperative pool — the same worker-thread hop the Tauri host
# makes explicitly through `process::run_blocking`.
tokio = { version = "1", features = ["rt"] }
# The `tokio` feature enables `async_runtime = "tokio"` on async exports:
# core's network ops run via `spawn_blocking`, which panics without a live
# tokio context.
uniffi = { version = "0.32", features = ["tokio"] }

[dev-dependencies]
# The async exports are tested by awaiting them directly, which needs a
# runtime — the `async_runtime` wrapper only applies to FFI-driven calls.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# The bindings generator is a dev-time tool, not part of the shipped library, so
# its CLI dependencies (clap & co.) stay out of the default build graph.
[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi_bindgen_swift.rs"
required-features = ["bindgen"]

[lints]
workspace = true
