name: LeoGit

# The Xcode project is generated, never committed — run `just mac-generate`
# (or `xcodegen generate` here) after changing this file or adding sources.

packages:
  # Terminal emulator for the embedded terminal — the native counterpart of
  # xterm.js. The version is pinned here because the generated project (and
  # its Package.resolved) is gitignored; bump deliberately, never downgrade.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.20.0

options:
  bundleIdPrefix: com.leomanrique
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

  fileTypes:
    # An Icon Composer document is a *directory* on disk, and XcodeGen walks
    # directories: without this it adds `icon.json` and `Assets/icon.png` as two
    # loose resources, which build without complaint and leave the app with the
    # generic icon, because nothing in the bundle is an icon any more. `file:
    # true` makes it one reference that actool compiles, which is how Xcode
    # itself treats the package.
    icon:
      file: true
      buildPhase: resources

settings:
  base:
    # Swift 6 language mode: data-race safety as errors rather than warnings.
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES

    # Deliberately NOT MainActor (the Xcode 26 template default for new apps).
    # UniFFI's generated bindings use raw pointers, `deinit`, and synchronous C
    # interop that cannot be main-actor isolated, and they are compiled into this
    # target — mozilla/uniffi-rs#2818. UI types opt in explicitly with @MainActor
    # instead; GitBridge relies on this default to keep blocking git work off the
    # main actor.
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

    # The pre-build phase runs cargo, which writes to <repo>/target and
    # ~/.cargo — both outside the sandbox's allowed paths.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

    # A local developer tool: it shells out to git and reads repositories
    # anywhere on disk, so it is unsandboxed and ad-hoc signed. No entitlements
    # file is declared, which leaves App Sandbox off.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    ENABLE_HARDENED_RUNTIME: NO

    # Surfaces the generated module.modulemap so the bindings'
    # `#if canImport(LeoGitCoreFFI)` guard resolves. If this path is wrong the
    # guard silently fails and every FFI symbol goes unresolved.
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/ffi/generated

    # The app declares no App Intents; skipping extraction silences the
    # otherwise-unavoidable "Metadata extraction skipped" build warning.
    LM_SKIP_METADATA_EXTRACTION: YES

targets:
  LeoGit:
    type: application
    platform: macOS

    sources:
      - path: Sources/LeoGit
      # Only the Swift API is compiled; the header and modulemap beside it are
      # consumed through SWIFT_INCLUDE_PATHS, not as build inputs.
      #
      # Deliberately not `optional: true`: this file is generated, and if it is
      # missing a hard failure here ("Source file not found") points straight at
      # the fix — run `just mac-bindings`. Marking it optional instead defers the
      # failure to Xcode, which reports a far more confusing missing-build-input
      # error against a file the build itself is supposed to produce.
      - path: ffi/generated/LeoGitCore.swift
      # The app icon, authored in Icon Composer. Deliberately *not* inside an
      # asset catalog — Xcode 26 consumes an `.icon` package standing on its
      # own, and putting one in a catalog is what Apple's own instructions say
      # not to do.
      - path: Resources/AppIcon.icon

    dependencies:
      - package: SwiftTerm

    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: LeoGit
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "© 2026 Leonardo Manrique"

        # Both version keys are declared rather than left out. XcodeGen does
        # not derive them from the build settings — an undeclared
        # CFBundleShortVersionString is written as the literal "1.0" — and the
        # app reads its own version back out of this dictionary to ask GitHub
        # whether a newer release exists. Left at the default it would compare
        # low against every tag and announce an update for ever.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"

        # Declaring folders as a document type is what routes `open -a LeoGit
        # <dir>` into
        # `NSApplicationDelegate.application(_:open:)`, cold and warm alike, so
        # LaunchServices supplies the single-instance behaviour the Tauri host
        # needs a socket plugin for. Finder's "Open With" and dropping a folder
        # on the Dock icon come with it.
        #
        # Rank Alternate, role Viewer: the app opens a folder when it is asked
        # to and never competes to become the machine's default handler for
        # every folder on it — which Owner or Default would invite.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.folder

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leomanrique.leogit.mac
        PRODUCT_NAME: LeoGit

        # The product's version, not this client's: one release covers both
        # frontends, and `scripts/_version.py` moves this line together with
        # tauri.conf.json, package.json and the host crate's Cargo.toml.
        # XcodeGen writes it into the generated Info.plist as
        # CFBundleShortVersionString, which is where the app reads its own
        # version back for the update check — nothing else can tell it, since
        # this number never reaches Cargo.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"

        # Host architecture only, in Release as well as Debug. The app links
        # `libleogit_ffi.a`, which `build-rust.sh` compiles for one target
        # triple, so a universal build would fail at the link step for the arch
        # the archive does not contain. The release pipeline is per-architecture
        # to match: the artifact carries the arch in its name and is built on a
        # machine of that kind, exactly as the Linux and Windows ones are.
        # Going universal means lipo-ing two cargo targets together first.
        ONLY_ACTIVE_ARCH: YES

        # Names `Resources/AppIcon.icon`, extension dropped. Set explicitly
        # rather than relying on the "AppIcon" default: the file being found at
        # all depends on this matching its basename, and a mismatch is silent —
        # the build succeeds and ships the generic icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOL_EXTENSIONS: NO
      configs:
        # Linked by absolute path rather than -l + LIBRARY_SEARCH_PATHS: the
        # archive lives in the workspace-root target/ dir, which differs per
        # configuration, and a full path is also immune to the linker preferring
        # a same-named .dylib should the crate ever add a cdylib crate-type.
        Debug:
          OTHER_LDFLAGS: ["$(inherited)", "$(SRCROOT)/../../target/debug/libleogit_ffi.a"]
        Release:
          OTHER_LDFLAGS: ["$(inherited)", "$(SRCROOT)/../../target/release/libleogit_ffi.a"]

    preBuildScripts:
      # Invoked by path rather than declared with `path:`, which would inline the
      # file's contents into the project — the script would then be a stale copy
      # frozen at generation time, and its own location would resolve to Xcode's
      # intermediates directory instead of the repo.
      - name: Build Rust core + generate bindings
        script: exec "${SRCROOT}/scripts/build-rust.sh"
        shell: /bin/bash
        # cargo does its own change detection, and the generated bindings are
        # not declared as outputs, so Xcode must not try to skip this phase.
        basedOnDependencyAnalysis: false

    scheme: {}
